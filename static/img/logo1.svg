<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  
  <!-- India flag color bars (thin, top) -->
  <rect x="20" y="18" width="60" height="4" rx="2" fill="#FF9933"/>
  <rect x="20" y="24" width="60" height="4" rx="2" fill="#FFFFFF" opacity="0.9"/>
  <rect x="20" y="30" width="60" height="4" rx="2" fill="#138808"/>

  <!-- Graph line going down (slowdown signal) -->
  <polyline 
    points="18,72 30,58 42,62 54,48 66,54 78,38 82,42"
    fill="none" 
    stroke="#3B82F6" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"/>
  
  <!-- Down arrow at end -->
  <polyline 
    points="76,50 82,58 88,50"
    fill="none" 
    stroke="#EF4444" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"/>

  <!-- Dot on latest point -->
  <circle cx="82" cy="58" r="3.5" fill="#EF4444"/>
</svg>
