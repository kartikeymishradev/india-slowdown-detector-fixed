<svg width="512" height="512" viewBox="0 0 512 512" version="1.2" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid/Pattern in Background -->
  <path d="M 64,128 L 448,128 M 64,256 L 448,256 M 64,384 L 448,384" stroke="rgba(255,255,255,0.03)" stroke-width="2" />
  <path d="M 128,64 L 128,448 M 256,64 L 256,448 M 384,64 L 384,448" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- Trend Bars (Macro Intelligence Theme) -->
  <rect x="140" y="320" width="30" height="80" rx="6" fill="rgba(255,255,255,0.1)" />
  <rect x="200" y="260" width="30" height="140" rx="6" fill="rgba(255,255,255,0.15)" />
  <rect x="260" y="200" width="30" height="200" rx="6" fill="rgba(255,255,255,0.2)" />
  <rect x="320" y="140" width="30" height="260" rx="6" fill="url(#accent-grad)" filter="url(#glow)" />
  
  <!-- Overlapping Rupee Symbol -->
  <g transform="translate(160, 150) scale(1.8)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.5))">
    <!-- Main Rupee Character (Stylized with paths for perfect rendering) -->
    <path d="M 20,20 L 70,20 M 20,35 L 65,35 M 20,20 C 55,20 65,55 35,55 L 20,55 M 20,55 L 60,95" 
          stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>